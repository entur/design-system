---
version: 2
registries:
  jfrog-artifactory:
    type: npm-registry
    url: https://entur2.jfrog.io/entur2
    token: ${{secrets.ARTIFACTORY_AUTH_TOKEN}}
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    commit-message:
      prefix: 'chore(gha/deps)'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'Europe/Oslo'
      day: 'monday'
    open-pull-requests-limit: 1
  - package-ecosystem: 'npm'
    directory: '/apps/documentation'
    registries:
      - jfrog-artifactory
    commit-message:
      prefix: 'chore(website/deps)'
    groups:
      all-deps:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-type: direct
      - dependency-type: production
      - dependency-type: development
