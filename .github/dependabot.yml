---
version: 2
registries:
  jfrog-artifactory:
    type: npm-registry
    url: ${{vars.ARTIFACTORY_URL}}
    token: ${{secrets.ARTIFACTORY_AUTH_TOKEN}}
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'Europe/Oslo'
      day: 'monday'
  - package-ecosystem: 'npm'
    directory: '/'
    registries:
      - jfrog-artifactory
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      major-updates:
        applies-to: version-updates
        update-types:
          - 'major'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
      - dependency-type: production
  - package-ecosystem: 'npm'
    directories:
      - '/packages/**/*'
    registries:
      - jfrog-artifactory
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      major-updates:
        applies-to: version-updates
        update-types:
          - 'major'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
      - dependency-type: production
  - package-ecosystem: 'npm'
    directories:
      - '/apps/**/*'
    registries:
      - jfrog-artifactory
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      major-updates:
        applies-to: version-updates
        update-types:
          - 'major'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
      - dependency-type: production
