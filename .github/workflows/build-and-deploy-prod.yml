name: Build and deploy to prod

on:
  push:
    branches:
      - 'main'
  repository_dispatch:
    types: [sanity_webhook]

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Use Nx cache
        uses: ./.github/actions/use-nx-cache

      - run: NX_REJECT_UNKNOWN_LOCAL_CACHE=0 yarn build:packages

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: 'packages/**/dist'

  deploy-sanity-graphql:
    name: Deploy Sanity GraphQL API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-sanity-${{ hashFiles('**/yarn.lock') }}
          only-for-workspace: 'studio-linje'

      - name: Deploy Sanity GraphQL API
        working-directory: apps/studio-linje
        run: |
          # Set non-interactive mode to avoid prompts
          export CI=true
          # Deploy GraphQL API - this will accept deploying breaking changes
          yarn deploy-graphql --yes --force
        env:
          # Add any necessary environment variables for Sanity deployment
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN || '' }}

  build-documentation:
    name: Build documentation
    needs: [build-packages, deploy-sanity-graphql]
    runs-on:
      group: 'grp-ubuntu-22.04-4core-x64'
    steps:
      - uses: actions/checkout@v4

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}
          only-for-workspace: '@entur/documentation @entur/code-playground'
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: 'packages'

      - name: Cache gatsby
        uses: actions/cache@v4
        with:
          path: |
            apps/documentation/.cache
            apps/documentation/public
          key: gatsby-${{ runner.os }}-${{ github.run_id }} # Since this is unique the cache will always be updated
          restore-keys: gatsby-${{ runner.os }} # But since this one always matches we will also always get a cache hit

      - name: Build documentation
        run: yarn build:documentation:skip-packages-dependency

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site-artifact
          path: |
            apps/documentation/public/**
            !apps/documentation/public/__node-manifests/**

  deploy-documentation-to-prod:
    name: Deploy documentation to production
    needs: build-documentation
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@v1
    with:
      gcp_project_id: entur-design-system
      environment: prd
      build_artifact_name: documentation-site-artifact
      build_artifact_path: 'apps/documentation/public'
      entry_point: 'apps/documentation'

  deploy-sanity-studio:
    name: Deploy Sanity Studio
    needs: build-documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-sanity-${{ hashFiles('**/yarn.lock') }}
          only-for-workspace: 'studio-linje'

      - name: Deploy Sanity Studio
        working-directory: apps/studio-linje
        run: |
          # Set non-interactive mode to avoid prompts
          export CI=true
          # Deploy without prompts using the config file
          yarn deploy --yes
        env:
          # Add any necessary environment variables for Sanity deployment
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN || '' }}
