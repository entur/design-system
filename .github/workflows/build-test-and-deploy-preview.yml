name: Build, test and deploy to preview channel

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Use Nx cache
        uses: ./.github/actions/use-nx-cache

      - run: NX_REJECT_UNKNOWN_LOCAL_CACHE=0 yarn build:packages

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: 'packages/**/dist'

  build-documentation:
    name: Build documentation
    needs: build-packages
    runs-on:
      group: 'grp-ubuntu-22.04-4core-x64'
    steps:
      - uses: actions/checkout@v4

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}
          only-for-workspace: '@entur/documentation'

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: 'packages'

      - name: Create cache key based on content changes
        id: cache_key
        run: |
          # Create a comprehensive hash of all relevant files for cache invalidation
          echo "Creating cache key for Gatsby build..."

          # Hash source files (components, pages, etc.)
          SRC_HASH=$(find apps/documentation/src -type f \( -name "*.tsx" -o -name "*.ts" -o -name "*.mdx" -o -name "*.md" -o -name "*.json" \) 2>/dev/null | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1 || echo "no-src-files")

          # Hash package.json and yarn.lock for dependency changes
          DEPS_HASH=$(sha256sum apps/documentation/package.json yarn.lock 2>/dev/null | sha256sum | cut -d' ' -f1 || echo "no-deps-files")

          # Hash Gatsby config and other config files
          CONFIG_HASH=$(find apps/documentation -maxdepth 1 -name "gatsby-*.js" -o -name "gatsby-*.ts" -o -name "*.config.*" 2>/dev/null | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1 || echo "no-config-files")

          # Combine all hashes for final cache key
          FINAL_HASH=$(echo "$SRC_HASH-$DEPS_HASH-$CONFIG_HASH" | sha256sum | cut -d' ' -f1)

          echo "cache-key=gatsby-${{ runner.os }}-${{ github.head_ref }}-$FINAL_HASH" >> $GITHUB_OUTPUT
          echo "Cache key created: gatsby-${{ runner.os }}-${{ github.head_ref }}-$FINAL_HASH"

      - name: Cache gatsby
        uses: actions/cache@v4
        with:
          path: |
            apps/documentation/.cache
            apps/documentation/public
            apps/documentation/.gatsby-context.js
            apps/documentation/.cache/caches
          key: ${{ steps.cache_key.outputs.cache-key }}
          restore-keys: |
            gatsby-${{ runner.os }}-${{ github.head_ref }}-
            gatsby-${{ runner.os }}-

      - name: Build documentation with incremental build
        run: |
          # Enable Gatsby incremental builds and optimizations
          export GATSBY_EXPERIMENTAL_DEV_SSR=false
          export GATSBY_EXPERIMENTAL_FAST_DEV=false
          export GATSBY_CPU_COUNT=4
          export GATSBY_PARALLEL_QUERY_RUNNING=true
          export GATSBY_EXPERIMENTAL_QUERY_ON_DEMAND=true
          export GATSBY_EXPERIMENTAL_DEV_SSR=false
          export GATSBY_EXPERIMENTAL_FAST_DEV=false

          # Check cache status and determine build strategy
          if [ -d "apps/documentation/.cache" ] && [ -f "apps/documentation/.cache/caches/gatsby-source-filesystem" ]; then
            echo "✅ Cache found - using incremental build"
            echo "Cache size: $(du -sh apps/documentation/.cache | cut -f1)"
            cd apps/documentation && yarn build:skip-props-generator
          else
            echo "🔄 No cache found - performing full build"
            cd apps/documentation && yarn build
          fi

          # Verify build output
          if [ -d "apps/documentation/public" ]; then
            echo "✅ Build completed successfully"
            echo "Build size: $(du -sh apps/documentation/public | cut -f1)"
            echo "Generated pages: $(find apps/documentation/public -name "*.html" | wc -l)"
          else
            echo "❌ Build failed - no public directory found"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site-artifact
          path: |
            apps/documentation/public/**
            !apps/documentation/public/__node-manifests/**

  test-packages:
    name: Test packages
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: 'packages'

      - run: yarn test

  lint-packages:
    name: Lint packages
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Use Nx cache
        uses: ./.github/actions/use-nx-cache

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: 'packages'

      - run: yarn lint

  deploy-documentation-to-preview-channel:
    needs: build-documentation
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-preview.yml@v1
    with:
      gcp_project_id: entur-design-system
      environment: prd
      build_artifact_name: documentation-site-artifact
      build_artifact_path: 'apps/documentation/public'
      entry_point: 'apps/documentation'
