name: Build, test and deploy to preview channel

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Use Nx cache
        uses: ./.github/actions/use-nx-cache

      - run: NX_REJECT_UNKNOWN_LOCAL_CACHE=0 yarn build:packages

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-artifacts
          path: 'packages/**/dist'

  build-documentation:
    name: Build documentation
    needs: build-packages
    runs-on:
      group: 'grp-ubuntu-22.04-4core-x64'
    steps:
      - uses: actions/checkout@v7.0.1
        # The skills changelog is built from git history
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}
          only-for-workspace: '@entur/documentation @entur/code-playground'

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: 'packages'

      - name: Build documentation
        run: yarn build:documentation:skip-packages-dependency

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site-artifact
          path: |
            apps/documentation/public/**
            !apps/documentation/public/__node-manifests/**

  build-sanity-studio:
    name: Build Sanity Studio
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The preview app in Studio renders with the documentation site's components
      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-sanity-docs-${{ hashFiles('**/yarn.lock') }}
          only-for-workspace: 'studio-linje @entur/documentation'

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: 'packages'

      - name: Build Sanity Studio
        working-directory: apps/studio-linje
        run: CI=true yarn build

  test-packages:
    name: Test packages
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Use Nx cache
        uses: ./.github/actions/use-nx-cache

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: 'packages'

      - run: NX_REJECT_UNKNOWN_LOCAL_CACHE=0 yarn test

  typecheck-packages:
    name: Typecheck packages
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Use Nx cache
        uses: ./.github/actions/use-nx-cache

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: 'packages'

      - run: NX_REJECT_UNKNOWN_LOCAL_CACHE=0 yarn typecheck:packages

  browser-tests:
    name: Typecheck and run browser tests
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: 'packages'

      - run: yarn typecheck:browser

      - run: yarn playwright install --with-deps chromium firefox webkit

      - run: yarn test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  lint-packages:
    name: Lint packages
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Use Nx cache
        uses: ./.github/actions/use-nx-cache

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: 'packages'

      - run: NX_REJECT_UNKNOWN_LOCAL_CACHE=0 yarn lint

      # The illustration page reads the colour mode, background and format of each file from its
      # name, so a file that breaks the naming convention shows up wrong or not at all.
      - name: Check the illustration names
        run: yarn check:illustration-names

  verify-skills:
    name: Verify skills against package APIs
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-${{ hashFiles('**/yarn.lock') }}

      # @entur/icons has no src entry point and the token CSS variables are generated,
      # so the check reads both packages' dist.
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: 'packages'

      - run: yarn verify:skills

  lint-commits:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Own cache key: this job installs only the root workspace, which must not
      # become the cache the other jobs restore.
      - name: Install and Cache Yarn Dependencies
        uses: ./.github/actions/install-and-cache-dependencies
        with:
          cache-key: yarn-root-${{ hashFiles('**/yarn.lock') }}
          only-for-workspace: design-system

      - run: yarn commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  deploy-documentation-to-preview-channel:
    needs: build-documentation
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-preview.yml@v1
    with:
      gcp_project_id: entur-design-system
      environment: prd
      build_artifact_name: documentation-site-artifact
      build_artifact_path: 'apps/documentation/public'
      entry_point: 'apps/documentation'
