<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  :root {
    --bg: var(--figma-color-bg, #fff);
    --text: var(--figma-color-text, #1e1e1e);
    --text-secondary: var(--figma-color-text-secondary, #757575);
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --off: var(--figma-color-bg-tertiary, #d9d9d9);
    --warning: var(--figma-color-text-warning, #b86200);
    --success: var(--figma-color-text-success, #14ae5c);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 11px/16px Inter, system-ui, -apple-system, sans-serif;
  }

  .selection {
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .name {
    overflow: hidden;
    font-weight: 600;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .meta,
  .warnings {
    color: var(--text-secondary);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    font-weight: 600;
  }

  .block {
    padding-block: 12px;
    border-bottom: 1px solid var(--border);
  }

  .block:last-of-type {
    border-bottom: 0;
  }

  .block > .row:first-child {
    margin-top: 0;
  }

  select {
    max-width: 140px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }

  select:disabled {
    opacity: 0.4;
  }

  select:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 1px;
  }

  .modes {
    margin-top: 6px;
    color: var(--text-secondary);
  }

  .warnings .warn {
    color: var(--warning);
  }

  .switch {
    position: relative;
    width: 28px;
    height: 16px;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: var(--off);
    cursor: pointer;
  }

  .switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    transition: transform 120ms ease-out;
  }

  .switch[aria-checked='true'] {
    background: var(--brand);
  }

  .switch[aria-checked='true']::after {
    transform: translateX(12px);
  }

  /* A deviating selection is neither on nor off */
  .switch[aria-checked='mixed']::after {
    transform: translateX(6px);
  }

  .switch:disabled {
    cursor: default;
    opacity: 0.4;
  }

  .switch:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  .state {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--off);
  }

  [data-state='on'] .dot {
    background: var(--success);
  }

  [data-state='deviates'] .dot {
    background: var(--warning);
  }

  .warnings {
    margin: 6px 0 0;
    padding: 0;
    list-style: none;
  }

  .check {
    margin-top: 12px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: transparent;
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }

  [hidden] {
    display: none;
  }
</style>

<div class="selection">
  <div class="name" id="name">Ingenting markert</div>
  <div class="meta" id="meta">Marker rammen med teksten</div>
</div>

<div class="block">
  <div class="row">
    <label for="context">Kontekst</label>
    <select id="context" disabled>
      <option value="" disabled>Ikke satt</option>
      <option value="custom" disabled>Egendefinert</option>
      <option value="mixed" disabled>Ulike kontekster</option>
      <option value="b2b">B2B</option>
      <option value="app">App</option>
      <option value="web">entur.no</option>
      <option value="article">Artikkel</option>
      <option value="kiosk">Kiosk</option>
    </select>
  </div>
  <div class="modes" id="modes">Marker en ramme for å velge kontekst</div>
  <ul class="warnings" id="context-warnings"></ul>
</div>

<div class="block" id="panel" data-state="empty">
  <div class="row">
    <label for="switch">Tekstrytme</label>
    <!-- A checkbox, since a switch has no mixed state for a deviating selection -->
    <button
      class="switch"
      id="switch"
      role="checkbox"
      aria-checked="false"
      aria-describedby="state"
      disabled
    ></button>
  </div>
  <div class="state"><span class="dot"></span><span id="state"></span></div>
  <ul class="warnings" id="warnings"></ul>
  <button class="check" id="check" hidden>Marker avvik</button>
</div>

<script>
  const panel = document.getElementById('panel');
  const name = document.getElementById('name');
  const meta = document.getElementById('meta');
  const toggle = document.getElementById('switch');
  const state = document.getElementById('state');
  const warnings = document.getElementById('warnings');
  const check = document.getElementById('check');
  const contextSelect = document.getElementById('context');
  const modes = document.getElementById('modes');
  const contextWarnings = document.getElementById('context-warnings');

  const STATES = {
    on: 'Følger reglene',
    off: 'Avstand av',
    none: 'Ingen tekstkomponenter i utvalget',
    empty: '',
  };

  let current = 'empty';

  function plural(count, one, many) {
    return `${count} ${count === 1 ? one : many}`;
  }

  function render(status) {
    current = status.state;
    panel.dataset.state = current;
    name.textContent = status.label || 'Ingenting markert';
    meta.textContent =
      current === 'empty'
        ? 'Marker rammen med teksten'
        : status.count
        ? plural(status.count, 'tekstelement', 'tekstelementer')
        : '';

    // Outside a vertical auto layout the rhythm can't be set, only turned off
    const loose = status.flow === false;
    toggle.disabled =
      current === 'empty' || current === 'none' || (loose && current === 'off');
    toggle.setAttribute(
      'aria-checked',
      current === 'on' ? 'true' : current === 'deviates' ? 'mixed' : 'false',
    );
    state.textContent =
      current === 'deviates'
        ? `${plural(status.deviations, 'element', 'elementer')} avviker`
        : loose && current === 'on'
        ? 'Avstand på'
        : STATES[current];

    warnings.replaceChildren();
    if (loose)
      warnings.append(
        item('Ikke i en vertikal auto layout, så tekstrytmen kan ikke settes'),
      );
    if (status.gaps)
      warnings.append(
        item(
          `${plural(
            status.gaps,
            'ramme',
            'rammer',
          )} med gap, som kommer i tillegg`,
        ),
      );
    if (status.others)
      warnings.append(
        item(
          `${plural(
            status.others,
            'annet element',
            'andre elementer',
          )} uten luft etter (koden gir 24)`,
        ),
      );
    check.hidden = current !== 'deviates';
    renderContext(status.context);
  }

  function describeModes(m) {
    const parts = [];
    if (m.typography) parts.push(`Tekst ${m.typography}`);
    if (m.size && m.size === m.spacing) parts.push(`Komponenter ${m.size}`);
    else {
      if (m.size) parts.push(`Størrelse ${m.size}`);
      if (m.spacing) parts.push(`Avstand ${m.spacing}`);
    }
    return parts.join(' · ');
  }

  function renderContext(context) {
    contextWarnings.replaceChildren();
    const ready =
      context && context.available && (context.modes || context.mixed);
    contextSelect.disabled = !ready;

    if (!context || !context.available) {
      contextSelect.value = '';
      modes.textContent = 'Marker en ramme for å velge kontekst';
      return;
    }

    if (context.mixed) {
      contextSelect.value = 'mixed';
      modes.textContent = 'De markerte rammene har ulike kontekster';
    } else if (!context.modes) {
      contextSelect.value = '';
      modes.textContent = context.loading
        ? 'Henter variabelsamlingene …'
        : 'Fant ikke variabelsamlingene i filen';
    } else {
      const m = context.modes;
      contextSelect.value = context.set ? context.id || 'custom' : '';
      modes.textContent = `${describeModes(m)}${
        context.set ? '' : ' (standard)'
      }`;
      if (m.size && m.spacing && m.size !== m.spacing)
        contextWarnings.append(
          item('Component size og Component spacing har ulike moduser', true),
        );
      if (context.unbound && context.unbound.length > 0) {
        const names = context.unbound
          .slice(0, 3)
          .map(([component, count]) => `${component} (${count})`)
          .join(', ');
        const rest = context.unbound.length - 3;
        contextWarnings.append(
          item(
            `Følger ikke ${m.size}: ${names}${
              rest > 0 ? ` og ${rest} til` : ''
            }`,
            true,
          ),
        );
      }
    }

    if (context.missing && context.missing.length > 0)
      contextWarnings.append(
        item(
          `${context.missing.join(' og ')} ${
            context.loading ? 'hentes fra biblioteket' : 'finnes ikke i filen'
          }`,
        ),
      );
  }

  function item(text, warn) {
    const li = document.createElement('li');
    li.textContent = text;
    if (warn) li.className = 'warn';
    return li;
  }

  contextSelect.addEventListener('change', () => {
    contextSelect.disabled = true;
    parent.postMessage(
      { pluginMessage: { type: 'context', id: contextSelect.value } },
      '*',
    );
  });

  // On turns the rhythm on, from off or from a deviating selection; only a following one turns off
  toggle.addEventListener('click', () => {
    toggle.disabled = true;
    parent.postMessage(
      { pluginMessage: { type: 'toggle', on: current !== 'on' } },
      '*',
    );
  });

  check.addEventListener('click', () => {
    parent.postMessage({ pluginMessage: { type: 'check' } }, '*');
  });

  onmessage = event => {
    const message = event.data.pluginMessage;
    if (message && message.type === 'status') render(message);
  };
</script>
